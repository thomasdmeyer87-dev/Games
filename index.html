<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Homework Practice</title>
  <link rel="stylesheet" href="assets/styles.css" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#f7f8fc" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Practice" />
</head>
<body>
  <main class="app-shell">
    <header class="home-head">
      <h1 id="hubTitle">Homework Practice</h1>
      <p class="sub" id="hubSub"></p>
    </header>
    <div class="kid-grid" id="kidGrid"></div>
  </main>

  <script src="assets/progress.js"></script>
  <script>
    // GitHub Pages serves everything with cache-control: max-age=600, and
    // there is no way to change that on a static site. A browser that has
    // been here before will therefore happily show a ten-minute-old menu,
    // so a newly added assignment just isn't there. The content files are
    // a couple of kilobytes, so ask for the current copy every time rather
    // than let that happen. Code files keep the normal caching.
    function freshScript(src) {
      return new Promise((resolve, reject) => {
        const s = document.createElement("script");
        s.src = src + (src.includes("?") ? "&" : "?") + "v=" + Date.now();
        s.onload = resolve;
        s.onerror = () => reject(new Error("Could not load " + src));
        document.head.appendChild(s);
      });
    }

    const ENGINE = {
      vocab: { icon: "📖", bg: "var(--tile-vocab)" },
      speak: { icon: "🗣️", bg: "var(--tile-speak)" },
      math:  { icon: "🔢", bg: "var(--tile-math)" }
    };

    function href(act) {
      return `engines/${encodeURIComponent(act.engine)}/index.html?set=${encodeURIComponent(act.set)}`;
    }

    // A tile wears a NEW badge for this many days after the date in the
    // manifest. Freshness and progress are different things: "just added"
    // is about the tile, "not tried yet" is about the child.
    const NEW_FOR_DAYS = 14;

    function isNewlyAdded(added) {
      if (!added) return false;                       // no date = never badged
      const when = Date.parse(added + "T00:00:00");   // local midnight, not UTC
      if (Number.isNaN(when)) return false;           // typo = never badged
      return (Date.now() - when) < NEW_FOR_DAYS * 86400000;
    }

    function starsMarkup(n) {
      let s = "";
      for (let i = 1; i <= 3; i++) s += `<span class="${i <= n ? "on" : "off"}">★</span>`;
      return `<span class="stars">${s}</span>`;
    }

    function tile(kidId, act) {
      const e = ENGINE[act.engine] || { icon: "✏️", bg: "var(--tile-vocab)" };
      const p = window.Progress.getActivity(kidId, act.set);
      const foot = p.plays > 0
        ? `${starsMarkup(p.bestStars)}<span class="tile-best">Best ${p.bestPct}%</span>`
        : starsMarkup(0);
      const badge = isNewlyAdded(act.added) ? `<span class="badge-new">New</span>` : "";
      return `
        <a class="tile" href="${href(act)}">
          <div class="tile-top">
            <div class="chip" style="background:${e.bg}">${e.icon}</div>
            ${badge}
          </div>
          <div class="tile-title">${act.title}</div>
          <div class="tile-foot">${foot}</div>
        </a>`;
    }

    function lockedTile() {
      return `
        <div class="tile locked">
          <div class="tile-top"><div class="chip">🔒</div></div>
          <div class="tile-title">Coming soon</div>
          <div class="tile-foot"><span class="tile-best">In the works</span></div>
        </div>`;
    }

    function kidSection(kid) {
      const c = kid.colors || ["#7c83ff", "#5b6cff"];
      const pr = window.Progress.getKid(kid.id);
      const lvl = pr.level;

      const subjects = (kid.subjects || []).map(sub => {
        const acts = sub.activities || [];
        const body = acts.length ? acts.map(a => tile(kid.id, a)).join("") : lockedTile();
        return `<div class="subj-cap">${sub.name}</div><div class="tiles">${body}</div>`;
      }).join("");

      return `
        <section class="kid" style="--kc1:${c[0]}; --kc2:${c[1]}; --kc-shadow:${c[1]}55">
          <div class="kid-hero">
            <div class="kid-hero-top">
              <div class="avatar">${kid.avatar || "🙂"}</div>
              <div class="kid-meta">
                <div class="kid-name">${kid.name}</div>
                <div class="kid-grade">${kid.grade || ""}</div>
              </div>
              <div class="kid-stats">
                <div class="stat-pill">🔥 ${pr.streak}</div>
                <div class="stat-pill">⭐ ${pr.totalStars}</div>
              </div>
            </div>
            <div class="xp">
              <div class="xp-row"><span>Level ${lvl.num}</span><span>${lvl.inLevel}/${lvl.perLevel} ⭐</span></div>
              <div class="xp-track"><div class="xp-fill" data-w="${lvl.pct}"></div></div>
            </div>
          </div>
          ${subjects}
        </section>`;
    }

    function render() {
      const m = window.MANIFEST || { kids: [] };
      document.getElementById("hubTitle").textContent = m.title || "Homework Practice";
      document.getElementById("hubSub").textContent = "Pick something to practice!";
      document.getElementById("kidGrid").innerHTML = (m.kids || []).map(kidSection).join("");
      // animate XP bars after paint
      requestAnimationFrame(() => {
        document.querySelectorAll(".xp-fill").forEach(el => { el.style.width = el.dataset.w + "%"; });
      });
    }

    freshScript("data/manifest.js").then(render).catch(() => {
      document.getElementById("hubSub").textContent =
        "Couldn't load the activities — check the connection and pull down to refresh.";
    });
  </script>
</body>
</html>
