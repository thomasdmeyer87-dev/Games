<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Homework Practice</title>
  <link rel="stylesheet" href="assets/styles.css" />
  <link rel="manifest" href="manifest.json" />
</head>
<body>
  <main class="app-shell">
    <section class="hero">
      <h1 id="hubTitle">Homework Practice</h1>
    </section>
    <section class="kid-grid" id="kidGrid"></section>
  </main>

  <script src="data/manifest.js"></script>
  <script>
    const COLORS = ["green", "blue", "purple", "orange"];

    function activityHref(act) {
      return `engines/${encodeURIComponent(act.engine)}/index.html?set=${encodeURIComponent(act.set)}`;
    }

    function render() {
      const m = window.MANIFEST || { kids: [] };
      document.getElementById("hubTitle").textContent = m.title || "Homework Practice";

      const grid = document.getElementById("kidGrid");
      grid.innerHTML = (m.kids || []).map((kid, ki) => {
        const color = COLORS[ki % COLORS.length];

        const subjects = (kid.subjects || []).map(sub => {
          const acts = sub.activities || [];
          const body = acts.length
            ? acts.map(a => `<a class="big-button ${color}" href="${activityHref(a)}">${a.title}</a>`).join("")
            : `<p class="coming-soon">${sub.name} — coming soon</p>`;
          return `
            <div class="subject">
              <h3 class="subject-title">${sub.name}</h3>
              ${body}
            </div>`;
        }).join("");

        return `
          <article class="kid-card">
            <h2>${kid.name}</h2>
            ${kid.grade ? `<p class="kid-grade">${kid.grade}</p>` : ""}
            ${subjects}
          </article>`;
      }).join("");
    }

    render();
  </script>
</body>
</html>
