<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Say the Word</title>
<link rel="stylesheet" href="../../assets/styles.css" />
<meta name="theme-color" content="#f2f2f7" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<style>
  .score-row { display:flex; justify-content:center; gap:10px; margin: 2px 0 18px; }
  .pill { display:flex; align-items:center; gap:6px; background:var(--card); box-shadow:var(--shadow);
    border-radius:99px; padding:6px 16px; font-weight:700; font-size:15px; }
  .pill.c { color:#16833a; } .pill.w { color:#c0271c; }

  .word-card {
    background:var(--card); border-radius:22px; box-shadow:var(--shadow);
    padding:46px 20px; text-align:center; position:relative;
    border: 2px solid transparent; transition: border-color .25s, box-shadow .25s;
    margin-bottom:14px;
  }
  .word-card.listening { border-color:var(--accent); }
  .word-card.success { border-color:#34c759; }
  .word-card.fail { border-color:#ff3b30; }
  .word { font-size:clamp(2.8rem,12vw,4.2rem); font-weight:800; letter-spacing:-0.02em; }
  .word-card.success .word { color:#16833a; }
  .word-card.fail .word { color:#c0271c; }
  .card-num { position:absolute; top:12px; right:16px; font-size:12px; font-weight:600; color:var(--text-2); }

  .heard-text { text-align:center; font-size:14px; font-weight:500; color:var(--text-2); min-height:1.3em; margin-bottom:18px; }
  .heard-text.got { color:#16833a; } .heard-text.missed { color:#c0271c; }

  .mic-wrap { display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:18px; }
  .mic-btn {
    width:84px; height:84px; border-radius:50%; border:none; cursor:pointer; font-size:2.3rem;
    display:flex; align-items:center; justify-content:center; color:#fff;
    background:var(--accent); box-shadow:0 8px 22px rgba(0,122,255,0.4);
    transition:transform .14s, background .2s; -webkit-tap-highlight-color:transparent;
  }
  .mic-btn:active { transform:scale(0.92); }
  .mic-btn.recording { background:#ff3b30; box-shadow:0 8px 22px rgba(255,59,48,0.45); animation:pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{box-shadow:0 8px 22px rgba(255,59,48,0.4);} 50%{box-shadow:0 8px 30px rgba(255,59,48,0.65),0 0 0 10px rgba(255,59,48,0.08);} }
  .mic-label { font-size:14px; font-weight:600; color:var(--text-2); min-height:1.3em; text-align:center; }

  .override-row { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-bottom:8px; opacity:0; pointer-events:none; transition:opacity .2s; }
  .override-row.visible { opacity:1; pointer-events:auto; }
  .obtn { border:none; border-radius:99px; padding:9px 18px; font-family:inherit; font-weight:600; font-size:14px; cursor:pointer; background:var(--card); box-shadow:var(--shadow); -webkit-tap-highlight-color:transparent; }
  .obtn.ok { color:#16833a; } .obtn.bad { color:#c0271c; } .obtn.skip { color:var(--accent); }

  .feedback { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%) scale(0.5); font-size:6rem; opacity:0; pointer-events:none; z-index:99; }
  .feedback.show { animation:fbPop .65s forwards; }
  @keyframes fbPop { 0%{opacity:1;transform:translate(-50%,-50%) scale(1);} 60%{opacity:1;transform:translate(-50%,-50%) scale(1.4);} 100%{opacity:0;transform:translate(-50%,-50%) scale(.8);} }

  .warn-box { background:#fff8e1; border:1px solid #ffd166; border-radius:14px; padding:14px 18px; text-align:center; color:#7a5800; font-weight:600; font-size:14px; margin-bottom:16px; display:none; line-height:1.5; }

  .results { display:none; text-align:center; padding-top:6px; }
  .results .emoji { font-size:60px; }
  .results h2 { font-size:26px; font-weight:800; letter-spacing:-0.02em; margin:4px 0 18px; }
  .res-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:14px; }
  .res-box { background:var(--card); border-radius:16px; box-shadow:var(--shadow); padding:18px 12px; }
  .res-box .big { font-size:40px; font-weight:800; } .res-box .lbl { font-size:13px; font-weight:600; color:var(--text-2); margin-top:2px; }
  .res-box.c .big { color:#16833a; } .res-box.w .big { color:#c0271c; }
  .missed-box { background:var(--card); border-radius:16px; box-shadow:var(--shadow); padding:16px 18px; margin-bottom:18px; text-align:left; }
  .missed-box h3 { font-size:14px; font-weight:700; color:#c0271c; margin:0 0 10px; }
  .missed-tags { display:flex; flex-wrap:wrap; gap:7px; }
  .m-tag { background:#fdecea; color:#c0271c; border-radius:99px; padding:4px 13px; font-weight:600; font-size:14px; }
</style>
</head>
<body>
<main class="game-shell">

  <div class="nav-bar">
    <a class="nav-back" href="../../index.html">‹ Menu</a>
    <div class="nav-title" id="subtitle">Say the Word</div>
    <div class="nav-right"></div>
  </div>

  <div class="progress-track"><div class="progress-fill" id="progressBar"></div></div>
  <div class="progress-cap" id="progressLabel">0 / 0</div>

  <div class="score-row">
    <div class="pill c">✓ <span id="cCount">0</span></div>
    <div class="pill w">✗ <span id="wCount">0</span></div>
  </div>

  <div class="warn-box" id="warnBox"></div>

  <div id="gameArea">
    <div class="word-card" id="card">
      <span class="card-num" id="cardNum"></span>
      <span class="word" id="wordDisplay">—</span>
    </div>
    <p class="heard-text" id="heardText"> </p>
    <div class="mic-wrap">
      <button class="mic-btn" id="micBtn" onclick="toggleListen()">🎤</button>
      <span class="mic-label" id="micLabel">Tap to speak</span>
    </div>
    <div class="override-row" id="overrideRow">
      <button class="obtn ok" onclick="overrideResult(true)">✓ Correct</button>
      <button class="obtn bad" onclick="overrideResult(false)">✗ Wrong</button>
      <button class="obtn skip" onclick="commitAndNext()">Next →</button>
    </div>
  </div>

  <div class="results" id="resultsArea">
    <div class="emoji">🎉</div>
    <h2>All Done!</h2>
    <div class="res-grid">
      <div class="res-box c"><div class="big" id="rC">0</div><div class="lbl">Got it</div></div>
      <div class="res-box w"><div class="big" id="rW">0</div><div class="lbl">Missed</div></div>
    </div>
    <div class="missed-box" id="missedBox" style="display:none">
      <h3>Keep practicing</h3>
      <div class="missed-tags" id="missedTags"></div>
    </div>
    <button class="btn-primary" onclick="restartGame()">Play Again</button>
    <div style="margin-top:10px"><a class="btn-text" href="../../index.html">Back to Menu</a></div>
  </div>

</main>
<div class="feedback" id="feedback"></div>

<script src="../../assets/loader.js"></script>
<script>
let WORDS = [], ALTS = {};
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false, resultPending = false, pendingOk = null;
let deck=[], cur=0, correct=0, wrong=0, missed=[];
let autoTimer = null;

function $(id){ return document.getElementById(id); }
function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a; }

function restartGame(){
  deck=shuffle(WORDS); cur=0; correct=0; wrong=0; missed=[];
  resultPending=false; pendingOk=null; listening=false; clearTimeout(autoTimer);
  $('cCount').textContent=0; $('wCount').textContent=0;
  $('resultsArea').style.display='none'; $('gameArea').style.display='block';
  resetUI(); showCard();
}

function showCard(){
  if(cur>=deck.length){ showResults(); return; }
  resetUI();
  const w=deck[cur]; const c=$('card');
  c.style.animation='none'; c.offsetHeight; c.style.animation='';
  $('wordDisplay').textContent=w;
  $('cardNum').textContent=`${cur+1} / ${deck.length}`;
  $('heardText').textContent=' '; $('heardText').className='heard-text';
  updateProgress();
}

function resetUI(){
  $('card').className='word-card'; $('micBtn').className='mic-btn';
  $('micLabel').textContent='Tap to speak'; $('overrideRow').className='override-row';
  resultPending=false; pendingOk=null; listening=false; clearTimeout(autoTimer);
}

function updateProgress(){
  $('progressBar').style.width=(cur/deck.length*100)+'%';
  $('progressLabel').textContent=`Word ${Math.min(cur+1,deck.length)} of ${deck.length}`;
}

function toggleListen(){
  if(resultPending) return;
  if(!SR){ showWarn("Speech recognition isn't supported in this browser. Try Chrome or Safari."); return; }
  if(listening){ rec && rec.stop(); return; }
  startListening();
}

function startListening(){
  rec = new SR(); rec.lang='en-US'; rec.interimResults=false; rec.maxAlternatives=6;
  listening=true;
  $('micBtn').className='mic-btn recording'; $('micLabel').textContent='Listening…';
  $('card').className='word-card listening'; $('heardText').textContent=' ';
  $('overrideRow').className='override-row';
  rec.onresult=(e)=>{ const alts=[]; for(let i=0;i<e.results[0].length;i++) alts.push(e.results[0][i].transcript.trim().toLowerCase()); judgeAnswer(alts); };
  rec.onerror=(e)=>{
    listening=false; $('card').className='word-card'; $('micBtn').className='mic-btn';
    if(e.error==='no-speech'){ $('micLabel').textContent='Nothing heard — try again'; }
    else if(e.error==='not-allowed'||e.error==='permission-denied'){ $('micLabel').textContent='Mic blocked'; showWarn('Microphone access was blocked. Allow mic access in your browser settings, then reload.'); }
    else { $('micLabel').textContent='Try again'; }
  };
  rec.onend=()=>{ listening=false; if(!resultPending){ $('card').className='word-card'; $('micBtn').className='mic-btn'; } };
  rec.start();
}

function judgeAnswer(alts){
  const target=deck[cur].toLowerCase();
  const accepted=[target,...(ALTS[target]||[])];
  let matched=false, bestHeard=alts[0]||'';
  for(const alt of alts){
    const words=alt.replace(/[^a-z\s]/g,'').trim().split(/\s+/);
    for(const acc of accepted){ if(words.includes(acc)){ matched=true; bestHeard=alt; break; } }
    if(matched) break;
  }
  $('heardText').textContent=`Heard: “${bestHeard}”`;
  $('heardText').className='heard-text '+(matched?'got':'missed');
  pendingOk=matched; resultPending=true;
  if(matched){ $('card').className='word-card success'; $('micLabel').textContent='✓ Great job!'; flash('⭐'); }
  else { $('card').className='word-card fail'; $('micLabel').textContent='Not quite — try again?'; flash('💪'); }
  $('micBtn').className='mic-btn';
  $('overrideRow').className='override-row visible';
  autoTimer=setTimeout(()=>{ if(resultPending) commitAndNext(); }, 2800);
}

function overrideResult(ok){ clearTimeout(autoTimer); pendingOk=ok; commitAndNext(); }

function commitAndNext(){
  clearTimeout(autoTimer);
  if(!resultPending){ cur++; showCard(); return; }
  if(pendingOk){ correct++; $('cCount').textContent=correct; }
  else { wrong++; $('wCount').textContent=wrong; missed.push(deck[cur]); }
  resultPending=false; cur++; setTimeout(showCard,350);
}

function flash(emoji){ const el=$('feedback'); el.textContent=emoji; el.classList.remove('show'); void el.offsetWidth; el.classList.add('show'); }
function showWarn(msg){ const b=$('warnBox'); b.textContent=msg; b.style.display='block'; }

function showResults(){
  $('gameArea').style.display='none'; $('resultsArea').style.display='block';
  $('rC').textContent=correct; $('rW').textContent=wrong;
  $('progressBar').style.width='100%'; $('progressLabel').textContent=`${deck.length} of ${deck.length}`;
  if(missed.length){ $('missedBox').style.display='block'; $('missedTags').innerHTML=missed.map(w=>`<span class="m-tag">${w}</span>`).join(''); }
  else { $('missedBox').style.display='none'; }
}

GameLoader.loadSet("../../").then(({ data, title }) => {
  document.title = title; $('subtitle').textContent = title;
  WORDS = (data.words || []).filter(Boolean); ALTS = data.alts || {};
  if(!WORDS.length) throw new Error("This activity has no words yet.");
  if(!SR) showWarn("Speech recognition isn't supported here. Please open in Chrome or Safari.");
  restartGame();
}).catch(err => { $('gameArea').style.display='none'; showWarn(err.message); });
</script>
</body>
</html>
