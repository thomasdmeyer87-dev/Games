<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Vocabulary</title>
  <link rel="stylesheet" href="../../assets/styles.css" />
  <!-- Added to the Home Screen, it opens full screen like an app: no tabs, no address bar. -->
  <link rel="manifest" href="../../manifest.json" />
  <link rel="apple-touch-icon" href="../../assets/icons/icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Practice" />
  <meta name="theme-color" content="#f2f2f7" />
  <style>
    .def-label {
      font-size: 12px; font-weight: 700; letter-spacing: 0.06em;
      color: var(--text-2); text-transform: uppercase; margin-bottom: 8px;
    }
    .def-text { font-size: 21px; font-weight: 600; line-height: 1.45; letter-spacing: -0.01em; }

    .prompt { font-size: 15px; font-weight: 600; color: var(--text-2); margin: 22px 2px 12px; }

    /* ---- Multiple choice ---- */
    .option {
      display: block; width: 100%; text-align: left;
      background: var(--card); border: none; border-radius: 14px;
      box-shadow: var(--shadow); padding: 15px 16px; margin-bottom: 10px;
      font-family: inherit; font-size: 17px; font-weight: 500; color: var(--text);
      cursor: pointer; -webkit-tap-highlight-color: transparent;
      transition: box-shadow 0.15s ease, transform 0.1s ease;
    }
    .option:active { transform: scale(0.99); }
    .option.picked { box-shadow: inset 0 0 0 2.5px var(--accent), var(--shadow); font-weight: 700; }

    /* ---- Spell it in ----
       There is deliberately no <input> anywhere. The letters are buttons, so
       iOS never offers its keyboard — which means no dictation and no
       autocorrect quietly fixing a misspelling. */
    .spell-wrap { display: flex; gap: 18px; align-items: flex-start; margin-top: 18px; }
    .spell-main { flex: 1; min-width: 0; }

    .answer-box {
      min-height: 62px; background: var(--card); border-radius: 14px;
      box-shadow: var(--shadow); padding: 14px 16px; display: flex;
      align-items: center; flex-wrap: wrap; gap: 1px;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 24px; font-weight: 600; letter-spacing: 0.02em; color: var(--text);
      word-break: break-all; white-space: pre-wrap;   /* show the space he typed */
    }
    .answer-box .placeholder { font-family: var(--font); font-size: 16px; font-weight: 600; color: #b9bdcc; letter-spacing: 0; }
    .caret { display: inline-block; width: 2px; height: 26px; background: var(--accent); animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    .keys { display: grid; grid-template-columns: repeat(7, 1fr); gap: 7px; margin-top: 14px; }
    .key {
      border: none; border-radius: 11px; background: var(--card); box-shadow: var(--shadow-sm);
      font-family: inherit; font-size: 18px; font-weight: 700; color: var(--text);
      padding: 13px 0; cursor: pointer; -webkit-tap-highlight-color: transparent;
      text-transform: lowercase; transition: transform 0.1s ease, filter 0.1s ease;
    }
    .key:active { transform: scale(0.93); filter: brightness(0.96); }
    .key.wide { grid-column: span 2; background: #e8eaf4; color: var(--text-2); font-size: 15px; }
    .key.space { grid-column: 1 / -1; color: var(--text-2); font-size: 15px; }

    .bank {
      flex: none; width: 190px; background: var(--card); border-radius: 14px;
      box-shadow: var(--shadow-sm); padding: 14px 16px;
    }
    .bank-cap {
      font-size: 11.5px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--text-2); margin-bottom: 9px;
    }
    .bank ul { list-style: none; margin: 0; padding: 0; }
    .bank li { font-size: 14.5px; font-weight: 600; line-height: 1.75; color: var(--text); word-break: break-all; }

    @media (max-width: 700px) {
      .spell-wrap { flex-direction: column; gap: 14px; }
      .bank { width: 100%; }
      .bank ul { columns: 2; column-gap: 14px; }
    }

    /* Short window — a landscape iPad with the tab bar showing, or a split
       view. Tighten the spacing so the whole card fits without scrolling.
       The definition and the words keep their size; they have to stay
       readable. */
    @media (max-height: 820px) {
      .prompt { margin: 14px 2px 9px; }
      .option { padding: 12px 16px; margin-bottom: 8px; }
      .spell-wrap { margin-top: 12px; gap: 14px; }
      .keys { gap: 6px; margin-top: 10px; }
      .key { padding: 10px 0; }
      .answer-box { min-height: 54px; padding: 11px 16px; }
      .bank { padding: 11px 14px; }
      .bank li { line-height: 1.6; }
    }
    @media (max-height: 620px) {
      .def-text { font-size: 19px; }
      .prompt { margin: 10px 2px 7px; }
      .option { padding: 10px 14px; margin-bottom: 6px; }
      .keys { gap: 5px; margin-top: 8px; }
      .key { padding: 8px 0; font-size: 17px; }
      .answer-box { min-height: 46px; padding: 8px 14px; font-size: 21px; }
    }

    .err { text-align: center; padding: 40px 24px; }
    .err .emoji { font-size: 60px; }
    .err .msg { font-size: 16px; color: var(--text-2); margin: 14px 0 20px; }
  </style>
</head>
<body>
<main class="game-shell" id="app">Loading…</main>

<script src="../../assets/loader.js"></script>
<script src="../../assets/progress.js"></script>
<script src="../../assets/history.js"></script>
<script>
  /* ============================================================
     VOCABULARY engine.

     Two rounds from the same word list:
       1. Ten cards: read the definition, pick the word from three.
       2. Three cards: read the definition and spell the word in,
          with the whole word list beside you as a bank.

     Nothing is marked while he works. He can go back, or skip a card
     and return to it; the last card has Submit. The score and a review
     sheet of every question come after that, so a wrong answer early on
     doesn't tell him what the later ones are.

     Spelling is exact — a typo counts as wrong, which is the point.
     The letters are buttons rather than a text field, so iOS never
     offers its keyboard: no dictation, and no autocorrect silently
     repairing a misspelling.
     ============================================================ */

  const CHOICES_PER_CARD = 3;
  const SPELL_ROUNDS = 3;
  const LETTERS = "abcdefghijklmnopqrstuvwxyz".split("");

  let TITLE = "Vocabulary";
  let terms = [];
  let KID = null, SETID = null, reward = null;
  let deck, index, answers, finished;

  const $ = id => document.getElementById(id);
  const shuffle = a => [...a].sort(() => Math.random() - 0.5);
  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  const TICK  = '<svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="9" fill="#157f3d"/><path d="M5.6 10.3l2.9 2.9 5.9-6.1" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const CROSS = '<svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="9" fill="#c0271c"/><path d="M6.8 6.8l6.4 6.4M13.2 6.8l-6.4 6.4" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>';

  /* ---------- Building the round ---------------------------------------- */

  function buildDeck() {
    const cards = shuffle(terms).map(t => ({ kind: "choice", term: t }));
    const spellWords = shuffle(terms).slice(0, Math.min(SPELL_ROUNDS, terms.length));
    return cards.concat(spellWords.map(t => ({ kind: "spell", term: t })));
  }

  function choicesFor(card) {
    const others = shuffle(terms.filter(t => t.word !== card.term.word)).map(t => t.word);
    return shuffle([card.term.word, ...others.slice(0, Math.max(0, CHOICES_PER_CARD - 1))]);
  }

  // Same word, same spelling. Case and stray spaces are not the test
  // ("bon  voyage" with two spaces is still bon voyage).
  const norm = s => s.trim().toLowerCase().replace(/\s+/g, " ");
  const isRight = (card, given) =>
    typeof given === "string" && norm(given) === norm(card.term.word);

  /* ---------- Flow ------------------------------------------------------- */

  function start() {
    deck = buildDeck();
    answers = deck.map(() => null);
    index = 0; finished = false; reward = null;
    render();
  }

  function pick(word) {
    answers[index] = word;
    render();
  }

  // A spelling answer is kept on its card, so going back finds it as he left it.
  function keyTap(ch) {
    const cur = answers[index] || "";
    if (ch === "back") answers[index] = cur.slice(0, -1);
    else if (ch === " " && (cur === "" || cur.endsWith(" "))) return;   // one space, between words
    else if (cur.length < 40) answers[index] = cur + ch;
    render();
  }

  // Back and Next move freely — Next on an unanswered card skips it.
  function go(i) {
    if (i < 0 || i >= deck.length) return;
    index = i;
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  const isBlank = a => a === null || a === "";
  function blankNote() {
    const nums = answers.map((a, i) => isBlank(a) ? i + 1 : 0).filter(Boolean);
    if (!nums.length) return "";
    const who = nums.length === 1 ? `Question ${nums[0]} is`
      : nums.length > 6 ? `${nums.length} questions are`
      : `Questions ${nums.slice(0, -1).join(", ")} and ${nums[nums.length - 1]} are`;
    return `<div class="gap-note">${who} still blank — tap Back to go back, or Submit to hand it in anyway.</div>`;
  }

  function finish() {
    const correct = deck.reduce((n, c, i) => n + (isRight(c, answers[i]) ? 1 : 0), 0);
    reward = window.Progress
      ? window.Progress.record(KID, SETID, Math.round(correct / deck.length * 100))
      : { stars: 0, streak: 0, totalStars: 0 };
    finished = true;
    if (window.WorkHistory) WorkHistory.save({
      kid: KID, set: SETID, title: TITLE, engine: "vocab",
      right: correct, total: deck.length,
      items: deck.map((c, i) => ({
        prompt: c.term.definition,
        kind: c.kind === "spell" ? "spelled" : undefined,
        given: isBlank(answers[i]) ? "Left blank" : answers[i],
        answer: c.term.word,
        right: isRight(c, answers[i])
      }))
    });
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  /* ---------- Screens ---------------------------------------------------- */

  function navBar(right) {
    return `<div class="nav-bar">
      <a class="nav-back" href="../../index.html">‹ Menu</a>
      <div class="nav-title">${esc(TITLE)}</div>
      <div class="nav-right">${right || ""}</div>
    </div>`;
  }

  function choiceScreen(card) {
    const chosen = answers[index];
    const opts = (card._choices || (card._choices = choicesFor(card)))
      .map(w => `<button class="option ${chosen === w ? "picked" : ""}" data-act="pick" data-word="${esc(w)}">${esc(w)}</button>`)
      .join("");
    return `
      <div class="card">
        <div class="def-label">Definition</div>
        <div class="def-text">${esc(card.term.definition)}</div>
      </div>
      <div class="prompt">Which word matches?</div>
      ${opts}`;
  }

  function spellScreen(card) {
    const typed = answers[index] || "";
    const shown = typed
      ? `${esc(typed)}<span class="caret"></span>`
      : `<span class="placeholder">Tap the letters to spell it</span>`;
    // A space bar only when a word in this list has a space in it (bon voyage).
    const needsSpace = terms.some(t => /\s/.test(t.word.trim()));
    const keys = LETTERS
      .map(c => `<button class="key" data-act="key" data-ch="${c}">${c}</button>`)
      .join("") + `<button class="key wide" data-act="key" data-ch="back">⌫ Delete</button>` +
      (needsSpace ? `<button class="key space" data-act="key" data-ch=" " aria-label="Space">space</button>` : "");
    const bank = terms.map(t => `<li>${esc(t.word)}</li>`).join("");
    return `
      <div class="card">
        <div class="def-label">Definition</div>
        <div class="def-text">${esc(card.term.definition)}</div>
      </div>
      <div class="prompt">Spell the word that matches. Spelling counts.</div>
      <div class="spell-wrap">
        <div class="spell-main">
          <div class="answer-box">${shown}</div>
          <div class="keys">${keys}</div>
        </div>
        <aside class="bank">
          <div class="bank-cap">Word bank</div>
          <ul>${bank}</ul>
        </aside>
      </div>`;
  }

  function reviewSheet() {
    const rows = deck.map((c, i) => {
      const given = answers[i];
      const right = isRight(c, given);
      const kind = c.kind === "spell" ? `<span class="rev-kind">spelled</span>` : "";
      const yours = (given === null || given === "") ? "Left blank" : esc(given);
      return `<div class="rev">
        <div class="rev-top">
          <div class="rev-mark">${right ? TICK : CROSS}</div>
          <div class="rev-def">${esc(c.term.definition)}${kind}</div>
        </div>
        ${right
          ? `<div class="rev-line good">${esc(c.term.word)}</div>`
          : `<div class="rev-line bad">You put: ${yours}</div>
             <div class="rev-line good">Answer: ${esc(c.term.word)}</div>`}
      </div>`;
    }).join("");
    return `<div class="review-cap">Review — every question</div>${rows}`;
  }

  function resultsScreen() {
    const correct = deck.reduce((n, c, i) => n + (isRight(c, answers[i]) ? 1 : 0), 0);
    const pct = Math.round(correct / deck.length * 100);
    const r = reward || { stars: 0, streak: 0, totalStars: 0 };
    const head = r.stars >= 3 ? "Amazing! 🏆" : r.stars === 2 ? "Great job! 🎉"
               : r.stars === 1 ? "Nice work! 👍" : "Keep going! 📚";
    const stars = [1, 2, 3].map(i => `<span class="big-star ${i <= r.stars ? "on" : ""}">★</span>`).join("");
    const chips = [
      r.streakUp ? `<div class="reward-chip fire">🔥 ${r.streak}-day streak</div>` : "",
      r.isNewBest ? `<div class="reward-chip new">⭐ New best!</div>` : "",
      `<div class="reward-chip">⭐ ${r.totalStars} total</div>`
    ].join("");
    return `${navBar("")}
      <div class="card reward">
        <div class="reward-stars">${stars}</div>
        <div class="headline">${head}</div>
        <div class="pct">${correct} of ${deck.length} correct · ${pct}%</div>
        <div class="reward-chips">${chips}</div>
        <button class="btn-primary" data-act="again">Play Again</button>
        <div style="margin-top:10px"><a class="btn-text" href="../../index.html">Back to Menu</a></div>
      </div>
      ${reviewSheet()}`;
  }

  function render() {
    if (finished) { $("app").innerHTML = resultsScreen(); return; }

    const card = deck[index];
    const last = index + 1 >= deck.length;
    const body = card.kind === "spell" ? spellScreen(card) : choiceScreen(card);

    const done = answers.filter(a => !isBlank(a)).length;

    $("app").innerHTML = `${navBar(`${index + 1}/${deck.length}`)}
      <div class="progress-track"><div class="progress-fill" style="width:${done / deck.length * 100}%"></div></div>
      <div class="progress-cap">Question ${index + 1} of ${deck.length}</div>
      ${body}
      ${last ? blankNote() : ""}
      <div class="action-bar">
        <button class="btn-sec" data-act="prev" ${index === 0 ? "disabled" : ""}>‹ Back</button>
        ${last
          ? `<button class="btn-primary" data-act="submit">Submit</button>`
          : `<button class="btn-primary" data-act="next">Next ›</button>`}
      </div>`;
  }

  /* Delegated clicks — definitions carry quotes and brackets, so nothing is
     interpolated into inline handlers. */
  document.addEventListener("click", e => {
    const el = e.target.closest("[data-act]");
    if (!el || el.disabled) return;
    switch (el.dataset.act) {
      case "pick":  pick(el.dataset.word); break;
      case "key":   keyTap(el.dataset.ch); break;
      case "next":   go(index + 1); break;
      case "prev":   go(index - 1); break;
      case "submit": finish(); break;
      case "again": start(); break;
    }
  });

  GameLoader.loadSet("../../").then(({ data, title, kidId, id }) => {
    TITLE = title; document.title = title; KID = kidId; SETID = id;
    terms = (data.terms || []).filter(t => t && t.word && t.definition);
    if (!terms.length) throw new Error("This activity has no terms yet.");
    start();
  }).catch(err => {
    $("app").innerHTML = `<div class="card err"><div class="emoji">😕</div>
      <div class="msg">${esc(err.message)}</div>
      <a class="btn-text" href="../../index.html">Back to Menu</a></div>`;
  });
</script>
</body>
</html>
