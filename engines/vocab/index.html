<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Vocabulary</title>
  <link rel="stylesheet" href="../../assets/styles.css" />
  <meta name="theme-color" content="#f2f2f7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <style>
    .def-label {
      font-size: 12px; font-weight: 700; letter-spacing: 0.06em;
      color: var(--text-2); text-transform: uppercase; margin-bottom: 8px;
    }
    .def-text { font-size: 21px; font-weight: 600; line-height: 1.45; letter-spacing: -0.01em; }

    .prompt { font-size: 15px; font-weight: 600; color: var(--text-2); margin: 22px 2px 12px; }

    .option {
      display: block; width: 100%; text-align: left;
      background: var(--card); border: none; border-radius: 14px;
      box-shadow: var(--shadow); padding: 15px 16px; margin-bottom: 10px;
      font-family: inherit; font-size: 17px; font-weight: 500; color: var(--text);
      cursor: pointer; -webkit-tap-highlight-color: transparent;
      transition: opacity 0.15s ease, transform 0.1s ease;
    }
    .option:active:not(:disabled) { transform: scale(0.99); }
    .option:disabled { cursor: default; }
    .option.correct { background: #e7f8ed; box-shadow: inset 0 0 0 2px #34c759; color: #16833a; }
    .option.wrong   { background: #fdecea; box-shadow: inset 0 0 0 2px #ff3b30; color: #c0271c; }
    .option.dimmed  { opacity: 0.45; }

    .feedback { text-align: center; font-size: 16px; font-weight: 600; margin: 6px 0 14px; min-height: 1.2em; }
    .feedback.ok  { color: #16833a; }
    .feedback.no  { color: #c0271c; }

    .done { text-align: center; padding: 40px 24px; }
    .done .emoji { font-size: 60px; }
    .done .pct { font-size: 52px; font-weight: 800; letter-spacing: -0.02em; margin: 6px 0 2px; }
    .done .score { font-size: 17px; color: var(--text-2); font-weight: 600; }
    .done .msg { font-size: 16px; color: var(--text-2); margin: 14px 0 26px; }

    .shake { animation: shake 0.4s ease; }
    @keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-7px);} 75%{transform:translateX(7px);} }
  </style>
</head>
<body>
<main class="game-shell" id="app">Loading…</main>

<script src="../../assets/loader.js"></script>
<script>
  const MAX_CHOICES = 6;
  let TITLE = "Vocabulary";
  let terms = [];
  let deck, index, score, selected, done;

  function shuffle(a){ return [...a].sort(() => Math.random() - 0.5); }
  function init(){ deck = shuffle(terms); index = 0; score = 0; selected = null; done = false; render(); }
  function current(){ return deck[index]; }

  function buildChoices(card){
    const others = shuffle(terms.filter(t => t.word !== card.word)).map(t => t.word);
    return shuffle([card.word, ...others.slice(0, Math.max(0, MAX_CHOICES - 1))]);
  }

  function handlePick(word){
    if (selected) return;
    selected = word;
    const card = current();
    const btn = document.querySelector(`[data-word="${CSS.escape(word)}"]`);

    if (word === card.word) { score++; }
    else { btn.classList.add('wrong', 'shake'); btn.addEventListener('animationend', () => btn.classList.remove('shake'), { once:true }); }

    document.querySelectorAll('.option').forEach(b => {
      const w = b.getAttribute('data-word');
      if (w === card.word) b.classList.add('correct');
      else if (w !== word) b.classList.add('dimmed');
      b.disabled = true;
    });

    document.querySelector('.nav-right').textContent = `${score}/${deck.length}`;

    const fb = document.querySelector('.feedback');
    const next = document.querySelector('.next-btn');
    if (selected === card.word) { fb.textContent = '✓ Correct'; fb.className = 'feedback ok'; }
    else { fb.textContent = `Answer: ${card.word}`; fb.className = 'feedback no'; }
    next.textContent = (index + 1 >= deck.length) ? 'See Results' : 'Next';
    next.style.display = 'block';
  }

  function handleNext(){
    if (index + 1 >= deck.length) done = true; else { index++; selected = null; }
    render();
  }

  function render(){
    const app = document.getElementById('app');

    if (done) {
      const pct = Math.round((score / deck.length) * 100);
      const emoji = pct === 100 ? '🏆' : pct >= 70 ? '🎉' : '📚';
      const msg = pct === 100 ? "Perfect score!" : pct >= 70 ? "Great job — keep it up!" : "Keep practicing, you've got this.";
      app.innerHTML = `
        <div class="nav-bar"><a class="nav-back" href="../../index.html">‹ Menu</a><div class="nav-title">${TITLE}</div><div class="nav-right"></div></div>
        <div class="card done">
          <div class="emoji">${emoji}</div>
          <div class="pct">${pct}%</div>
          <div class="score">${score} of ${deck.length} correct</div>
          <div class="msg">${msg}</div>
          <button class="btn-primary" onclick="init()">Try Again</button>
          <div style="margin-top:10px"><a class="btn-text" href="../../index.html">Back to Menu</a></div>
        </div>`;
      return;
    }

    const card = current();
    const choices = buildChoices(card);
    const progress = (index / deck.length) * 100;
    app.innerHTML = `
      <div class="nav-bar">
        <a class="nav-back" href="../../index.html">‹ Menu</a>
        <div class="nav-title">${TITLE}</div>
        <div class="nav-right">${score}/${deck.length}</div>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${progress}%"></div></div>
      <div class="progress-cap">Question ${index + 1} of ${deck.length}</div>
      <div class="card">
        <div class="def-label">Definition</div>
        <div class="def-text">${card.definition}</div>
      </div>
      <div class="prompt">Which word matches?</div>
      ${choices.map(w => `<button class="option" data-word="${w}" onclick="handlePick('${w.replace(/'/g,"\\'")}')">${w}</button>`).join('')}
      <div class="feedback"></div>
      <button class="btn-primary next-btn" style="display:none" onclick="handleNext()"></button>`;
  }

  GameLoader.loadSet("../../").then(({ data, title }) => {
    TITLE = title; document.title = title;
    terms = (data.terms || []).filter(t => t && t.word && t.definition);
    if (!terms.length) throw new Error("This activity has no terms yet.");
    init();
  }).catch(err => {
    document.getElementById('app').innerHTML =
      `<div class="card done"><div class="emoji">😕</div><div class="msg">${err.message}</div>
       <a class="btn-text" href="../../index.html">Back to Menu</a></div>`;
  });
</script>
</body>
</html>
