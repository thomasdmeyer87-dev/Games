<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Math Practice Test</title>
  <link rel="stylesheet" href="../../assets/styles.css" />
  <!-- Added to the Home Screen, it opens full screen like an app: no tabs, no address bar. -->
  <link rel="manifest" href="../../manifest.json" />
  <link rel="apple-touch-icon" href="../../assets/icons/icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Practice" />
  <meta name="theme-color" content="#f7f8fc" />
  <style>
    /* ============================================================
       The question area deliberately copies the look of the real
       online test (plain white card, gray radio buttons, black
       audio bar) so the format is familiar on test day. The menu
       bar and the results screen keep the app's own playful style.
       ============================================================ */

    .test-surface {
      background: #fff; border: 1px solid #e3e3e3; border-radius: 6px;
      padding: 26px 24px 28px; margin-bottom: 18px;
      font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
    .verdict { font-size: 19px; font-weight: 600; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
    .verdict.right { color: #157f3d; }
    .verdict.wrong { color: #c0271c; }
    .verdict svg { width: 20px; height: 20px; flex: none; }

    /* ---- Black audio pill ---- */
    .audio-bar {
      display: inline-flex; align-items: center; gap: 11px;
      background: #1c1c1c; border-radius: 8px; padding: 10px 14px;
      margin-bottom: 14px; cursor: pointer; user-select: none;
      -webkit-tap-highlight-color: transparent; border: none;
      transition: filter 0.12s;
    }
    .audio-bar:active { filter: brightness(1.35); }
    .audio-bar.sm { padding: 8px 12px; gap: 9px; margin-bottom: 8px; }
    .ab-icon { width: 24px; height: 24px; flex: none; display: block; }
    .audio-bar.sm .ab-icon { width: 21px; height: 21px; }
    /* A tall, easy-to-grab strip around the thin line. */
    .ab-seek { display: flex; align-items: center; height: 32px; margin: -14px 0; padding: 0 7px;
               cursor: pointer; touch-action: none; flex: none; }
    .ab-track { position: relative; width: 210px; height: 4px; background: #666; border-radius: 2px; flex: none; }
    .ab-seek.dragging .ab-knob { width: 18px; height: 18px; margin-left: -9px; transition: none; }
    .audio-bar.sm .ab-track { width: 185px; }
    .ab-knob {
      position: absolute; top: 50%; left: 0; width: 13px; height: 13px;
      margin-left: -6px; border-radius: 50%; background: #fff;
      transform: translateY(-50%); transition: left 0.15s linear;
    }
    .no-voice { color: #999; font-size: 13px; margin-bottom: 12px; font-style: italic; }

    /* ---- Question text ---- */
    .q-text { font-size: 19px; line-height: 1.55; color: #1a1a1a; }
    .q-text .ln { display: block; }
    .q-figure {
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 17px; line-height: 1.7; color: #1a1a1a;
      margin: 14px 0 0; white-space: pre; overflow-x: auto;
    }

    /* ---- Choices (radio / checkbox, test style) ---- */
    .choices { margin-top: 20px; }
    .choice {
      display: flex; align-items: center; gap: 14px; width: 100%;
      padding: 9px 0; margin: 0;
      font-size: 18px; color: #6b6b6b; text-align: left;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .choice:focus-visible { outline: 2px solid #3b82f6; outline-offset: 3px; border-radius: 4px; }
    .choice.stacked { display: block; padding: 4px 0 12px; }
    .choice.stacked .pick-row { display: flex; align-items: center; gap: 14px; }
    .mark { width: 21px; height: 21px; flex: none; }
    .mark circle, .mark rect { transition: fill 0.12s, stroke 0.12s; }
    .choice-text { line-height: 1.4; }
    .choice.on .choice-text { color: #1a1a1a; }
    .choice.key .choice-text { color: #157f3d; font-weight: 600; }
    .choice.miss .choice-text { color: #c0271c; }

    /* ---- Drag-to-fill ---- */
    .bank { display: flex; flex-wrap: wrap; gap: 12px; margin: 22px 0 26px; }
    .chip {
      min-width: 104px; text-align: center; background: #fff;
      border: 1px solid #c8c8c8; border-radius: 4px; padding: 13px 16px;
      font-family: inherit; font-size: 18px; color: #4a4a4a;
      cursor: grab; touch-action: none; user-select: none;
      box-shadow: 0 1px 2px rgba(0,0,0,0.06);
      transition: border-color 0.12s, background 0.12s;
    }
    .chip.armed { border-color: #3b82f6; background: #eff6ff; color: #1a1a1a; }
    .chip.ghost {
      position: fixed; z-index: 99; pointer-events: none; opacity: 0.92;
      box-shadow: 0 8px 20px rgba(0,0,0,0.22); cursor: grabbing;
    }
    .drag-line { font-size: 19px; color: #1a1a1a; line-height: 2.6; }
    .drag-line.mono {
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 18px; white-space: pre; line-height: 1.35; margin-bottom: 6px;
    }
    .drag-table { border-collapse: collapse; margin-top: 2px; font-size: 18px; color: #1a1a1a; }
    .drag-table th {
      font-size: 15px; font-weight: 700; line-height: 1.25; padding: 7px 18px;
      background: #f3f5f9; border: 1px solid #c8c8c8; text-align: center;
    }
    .drag-table td { border: 1px solid #c8c8c8; padding: 4px 14px; text-align: center; min-width: 150px; }
    .drag-table .blank { margin: 0; height: 42px; min-width: 112px; }
    .drag-rule { width: 158px; height: 2px; background: #9a9a9a; margin: 8px 0 10px 34px; }
    .blank {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 118px; height: 50px; vertical-align: middle; margin: 0 6px;
      background: #fff; border: 1px solid #c8c8c8; border-radius: 4px;
      font-size: 18px; color: #4a4a4a; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: border-color 0.12s, background 0.12s;
    }
    .blank.hot   { border-color: #3b82f6; background: #eff6ff; border-width: 2px; }
    .blank.key   { color: #157f3d; font-weight: 600; border-color: #9ad0ae; }
    .blank.miss  { color: #c0271c; border-color: #e6a9a3; }

    /* ---- Question navigator + footer (app style) ---- */
    .qnav { display: flex; flex-wrap: wrap; gap: 7px; margin: 2px 2px 16px; }
    .qdot {
      width: 30px; height: 30px; border-radius: 10px; border: none;
      font-family: var(--font); font-size: 13px; font-weight: 800;
      background: #e4e6f2; color: var(--text-2); cursor: pointer;
      -webkit-tap-highlight-color: transparent; transition: transform 0.12s ease;
    }
    .qdot:active { transform: scale(0.92); }
    .qdot.answered { background: linear-gradient(135deg, #ffb15c, #ff8a3d); color: #fff; }
    .qdot.right    { background: linear-gradient(135deg, #5bd68a, #24a65a); color: #fff; }
    .qdot.wrong    { background: linear-gradient(135deg, #ff8b80, #e0483a); color: #fff; }
    .qdot.current  { box-shadow: 0 0 0 3px rgba(91,108,255,0.4); }

    .test-foot { display: flex; gap: 10px; }
    .test-foot .btn-sec { align-self: stretch; }
    /* The "still blank" note above Submit: one compact line, so the last
       question still fits a landscape iPad with tabs. */
    .stage-card .gap-note { font-size: 13px; line-height: 1.3; padding: 5px 12px; margin-top: 5px; border-radius: 10px; }
    .test-foot .btn-primary { margin: 0; }
    .btn-primary.submit { background: linear-gradient(135deg, #ffb15c, #ff8a3d); box-shadow: 0 8px 20px rgba(255,138,61,0.38); }

    .why {
      font-size: 15px; line-height: 1.55; color: #5a5a5a;
      background: #f6f7f9; border-left: 3px solid #c8c8c8;
      border-radius: 0 4px 4px 0; padding: 12px 14px; margin-top: 20px;
    }
    /* ---- Show your work: scratch pad + typed answer ----
       The pad is a blank white sheet he draws on with a finger or a
       pencil, like the margin of the paper test — no grid, it's his space. The answer is typed on
       on-screen keys, not a text field, so the iPad keyboard never opens:
       no talk-to-text, no autocorrect. */
    .pad {
      position: relative; margin-top: 18px; border: 1px solid #c8c8c8; border-radius: 6px;
      overflow: hidden; background: #fff;
    }
    .pad canvas { display: block; width: 100%; height: 250px; touch-action: none; cursor: crosshair; }

    /* Nothing on a test needs selecting or copying. Without this, iPad Safari
       reads a finger dragging across the scratch pad as "select this text"
       and starts highlighting words on the page, with the Copy bubble. */
    body {
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none;
    }
    /* Toolbar strip across the top of the sheet, so the buttons never sit
       on his drawing. */
    .pad-bar {
      display: flex; align-items: center; gap: 6px; padding: 6px 8px 6px 12px;
      border-bottom: 1px solid #e3e3e3; background: #fafafa;
    }
    .pad-cap { flex: 1; font-size: 13.5px; font-weight: 600; color: #6b6b6b; }
    .pad-btn {
      border: 1px solid #c8c8c8; border-radius: 5px; background: #fff; color: #3a3a3a;
      font: inherit; font-size: 13.5px; padding: 6px 11px; cursor: pointer;
      display: inline-flex; align-items: center; gap: 5px;
      -webkit-tap-highlight-color: transparent;
    }
    .pad-btn svg { width: 16px; height: 16px; flex: none; }
    .pad-btn:disabled { opacity: 0.4; cursor: default; }
    .pad-tools { display: inline-flex; }
    .pad-tools .pad-btn { border-radius: 0; }
    .pad-tools .pad-btn:first-child { border-radius: 5px 0 0 5px; }
    .pad-tools .pad-btn:last-child { border-radius: 0 5px 5px 0; margin-left: -1px; }
    .pad-btn.on { background: #e8f0fe; border-color: #3b82f6; color: #1d4ed8; position: relative; z-index: 1; }
    .pad.erasing canvas { cursor: cell; }
    .entry-wrap { display: flex; gap: 18px; align-items: flex-start; margin-top: 16px; flex-wrap: wrap; }
    .entries { flex: 1; min-width: 210px; display: grid; gap: 10px; }
    .entry { display: flex; align-items: center; gap: 10px; }
    .entry-label { min-width: 26px; font-size: 18px; font-weight: 600; color: #1a1a1a; }
    .entry-box {
      flex: 1; min-height: 50px; display: flex; align-items: center; padding: 0 14px;
      background: #fff; border: 1px solid #c8c8c8; border-radius: 4px; cursor: pointer;
      font-size: 22px; color: #1a1a1a; font-variant-numeric: tabular-nums;
      -webkit-tap-highlight-color: transparent;
    }
    .entry-box.active { border: 2px solid #3b82f6; padding: 0 13px; }   /* a focused text field */
    .entry-box.key  { color: #157f3d; font-weight: 600; border-color: #9ad0ae; }
    .entry-box.miss { color: #c0271c; border-color: #e6a9a3; }
    .entry-caret { display: inline-block; width: 2px; height: 24px; background: #3b82f6; margin-left: 1px; animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .numpad { display: grid; grid-template-columns: repeat(3, 64px); gap: 8px; }
    .num {
      height: 50px; border: 1px solid #c8c8c8; border-radius: 6px; background: #fff;
      font: inherit; font-size: 21px; color: #1a1a1a; cursor: pointer;
      -webkit-tap-highlight-color: transparent; transition: background 0.1s;
    }
    .num:active { background: #e8edf5; }
    .num.del { grid-column: span 3; font-size: 15px; color: #4a4a4a; }
    .num.sym { font-size: 26px; line-height: 1; padding-bottom: 6px; }

    /* The stage: test card, scratch paper, and the Back / Next row.
       Upright: card, then (on questions he works out) the scratch paper,
       then the buttons. */
    .stage {
      flex: 1; display: grid; grid-template-columns: minmax(0, 1fr);
      grid-template-areas: "card" "pad" "foot"; grid-template-rows: auto auto 1fr;
    }
    .stage-card { grid-area: card; min-width: 0; }
    .stage-pad  { grid-area: pad; min-width: 0; display: none; }
    .stage.shows-work .stage-pad { display: block; }
    .stage-pad .pad { margin: 0 0 4px; }
    .stage-foot { grid-area: foot; align-self: end; }

    /* Landscape iPad in a browser with tabs — how he actually uses it.
       Scratch paper down the whole left side on every question; the test,
       looking just as it always has, on the right with its buttons. */
    @media (orientation: landscape) and (min-width: 900px) {
      .game-shell { max-width: 1200px; }
      .stage {
        grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);
        grid-template-areas: "pad card" "pad foot"; grid-template-rows: auto 1fr;
        column-gap: 22px;
      }
      .stage-pad { display: block; align-self: start; position: sticky; top: 8px; }
      .stage-pad .pad { margin: 0; }
      .test-surface { margin-bottom: 0; }
      /* Answer box across the top, keys in two short rows under it —
         1-7, then 8 9 0 , . ⌫ — so a typed answer costs as little height
         as possible. Four boxes (A-D) sit side by side. */
      .entry-wrap { flex-direction: column; align-items: stretch; gap: 10px; }
      .entries { grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); }
      .numpad { grid-template-columns: repeat(7, minmax(0, 1fr)); }
      .num.del { grid-column: span 2; }
    }
    /* Smaller iPads in landscape with tabs (~620-700px of window). */
    @media (orientation: landscape) and (min-width: 900px) and (max-height: 700px) {
      .audio-bar { padding: 7px 12px; margin-bottom: 8px; }
      .q-text { font-size: 18px; line-height: 1.4; }
      .q-figure { font-size: 15.5px; line-height: 1.45; margin-top: 8px; }
      .bank { gap: 8px; margin: 9px 0 10px; }
      .chip { padding: 8px 12px; }
      .blank { height: 40px; }
      .drag-line { line-height: 1.85; }
      .entry-wrap { margin-top: 9px; gap: 8px; }
    }

    /* ---- Which test? (a tile that offers a Quick Check and the full one) ---- */
    .which-head { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; margin: 14px 4px 4px; }
    .which-sub { color: var(--text-2); font-size: 15px; font-weight: 600; margin: 0 4px 18px; }
    .which { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
    .which-card {
      display: flex; flex-direction: column; gap: 10px; text-decoration: none; color: var(--text);
      background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
      padding: 22px; -webkit-tap-highlight-color: transparent; transition: transform 0.12s ease;
    }
    .which-card:active { transform: scale(0.98); }
    .which-icon {
      width: 52px; height: 52px; border-radius: 15px; display: flex; align-items: center; justify-content: center;
      font-size: 28px; background: var(--tile-math); box-shadow: 0 6px 14px rgba(255,138,61,0.28);
    }
    .which-icon.quick { background: linear-gradient(135deg, #7c83ff, #5b6cff); box-shadow: 0 6px 14px rgba(91,108,255,0.28); }
    .which-title { font-size: 22px; font-weight: 800; letter-spacing: -0.01em; }
    .which-foot { display: flex; align-items: center; gap: 8px; margin-top: auto; padding-top: 6px; }
    .which-stars { font-size: 18px; letter-spacing: 1px; color: #d8dbe8; }
    .which-stars .on { color: var(--gold); }
    .which-best { font-size: 13px; font-weight: 800; color: var(--text-2); }

    /* Review sheet extras (the shared .rev styles live in styles.css) */
    /* A select-all answer lists one choice per line. */
    .why { white-space: pre-line; }
    .err { text-align: center; padding: 40px 24px; }
    .err .emoji { font-size: 60px; }
    .err .msg { font-size: 16px; color: var(--text-2); margin: 14px 0 20px; }

    @media (max-width: 420px) {
      .ab-track { width: 150px; }
      .audio-bar.sm .ab-track { width: 130px; }
      .test-surface { padding: 20px 16px 22px; }
    }

    /* Short window — a landscape iPad with the tab bar showing, or a split
       view. Tighten the spacing so more of the question fits without
       scrolling. The text itself stays the size it is; a 4th grader has to be
       able to read it. */
    @media (max-height: 820px) {
      .test-surface { padding: 18px 20px 20px; margin-bottom: 10px; }
      .qnav { margin-bottom: 10px; }
      .qdot { width: 27px; height: 27px; }
      .audio-bar { margin-bottom: 10px; }
      .q-text { line-height: 1.45; }
      .q-figure { margin-top: 10px; line-height: 1.55; }
      .drag-table th { padding: 5px 16px; font-size: 14.5px; }
      .drag-table td { padding: 2px 12px; }
      .drag-table .blank { height: 36px; }
      .choices { margin-top: 13px; }
      .choice { padding: 6px 0; }
      .choice.stacked { padding: 2px 0 8px; }
      .bank { gap: 9px; margin: 14px 0 16px; }
      .chip { padding: 10px 14px; }
      .blank { height: 44px; }
      .drag-line { line-height: 2.2; }
      .pad canvas { height: 190px; }
      .entry-wrap { margin-top: 12px; }
      .entry-box { min-height: 44px; }
      .num { height: 44px; }
      .numpad { gap: 6px; }
      .why { margin-top: 13px; padding: 10px 12px; }
      .verdict { margin-bottom: 10px; }
    }
    @media (max-height: 620px) {
      .test-surface { padding: 14px 18px 16px; }
      .qnav { margin-bottom: 7px; }
      .bank { margin: 11px 0 12px; }
      .choices { margin-top: 10px; }
      .drag-line { line-height: 2; }
    }
  </style>
</head>
<body>
<main class="game-shell" id="app">Loading…</main>

<script src="../../assets/loader.js"></script>
<script src="../../assets/progress.js"></script>
<script src="../../assets/history.js"></script>
<script>
  /* ============================================================
     MATH PRACTICE TEST engine.

     Built to mirror the online test Evan actually sits: same card
     layout, same black "play" bar, same question types.

       type: "choice"  one answer      -> answer: <index>
       type: "multi"   select all      -> answers: [<index>, ...]
       type: "drag"    drag to fill    -> bank + template + answers

     Nothing is marked while he works, like the real test. He can
     change any answer, skip around with the numbers along the top,
     and go back. The score and a review of every question come at
     the end. After that, tapping a question number shows that
     question marked, with the right answer and a short why.

     Every question can be read aloud with the browser's built-in
     voice. Set  audioChoices: true  to put a play bar on each
     answer choice too, the way the harder word problems do.
     ============================================================ */

  let TITLE = "Math Practice Test";
  let SOURCE = null;     // the content file as loaded
  let MODE = "";         // "quick" = Quick Check, otherwise every question
  let quickPlan = null;  // this Quick Check's kinds, and what's left after it
  let questions = [];    // this attempt's questions
  let KID = null, SETID = null;
  let answers = [], revealed = false, index = 0, finished = false, reward = null;
  let pads = [], activeEntry = 0;   // scratch-pad strokes per question; which answer box is taking keys
  let erasing = false;              // scratch pad tool: pencil (false) or eraser (true)

  const $ = id => document.getElementById(id);
  const synth = window.speechSynthesis;

  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  const sameSet = (a, b) =>
    a.length === b.length && [...a].sort().every((v, i) => v === [...b].sort()[i]);

  /* ---------- Read aloud ---------------------------------------------------
     speechSynthesis reads the text; the bar's knob tracks real progress
     using word-boundary events, so it behaves like the test's player. */

  let playingKey = null;

  function speakable(s) {
    return String(s)
      .replace(/\s*[☐□]\s*/g, " what number ")
      .replace(/\s*≥\s*/g, " is greater than or equal to ")
      .replace(/\s*≤\s*/g, " is less than or equal to ")
      .replace(/\s*≠\s*/g, " is not equal to ")
      .replace(/\s*×\s*/g, " times ")
      .replace(/\s*÷\s*/g, " divided by ")
      .replace(/\s*[−–]\s*/g, " minus ")
      .replace(/\s*\+\s*/g, " plus ")
      .replace(/\s*=\s*/g, " equals ")
      .replace(/\s*<\s*/g, " is less than ")
      .replace(/\s*>\s*/g, " is greater than ")
      .replace(/(\d)\s*\/\s*(\d)/g, "$1 over $2")
      .replace(/[\u2500-\u257f|]+/g, " ")
      .replace(/_{2,}/g, " blank ")
      .replace(/\{\d+\}/g, " blank ")
      .replace(/\s{2,}/g, " ")
      .trim();
  }

  function textFor(q, key) {
    if (key.startsWith("c")) return speakable(q.choices[Number(key.slice(1))]);
    if (q.say) return speakable(q.say);     // a figure that reads badly gets its own words
    const parts = [speakable(q.prompt)];
    if (q.figure) parts.push(speakable(q.figure));
    if (q.template) parts.push(q.template.map(speakable).join(". "));
    if (q.table) parts.push(q.table.rows.map(r => r.map(speakable).join(", ")).join(". "));
    return parts.join(". ");
  }

  function stopSpeech() {
    if (synth) synth.cancel();
    playingKey = null;
    document.querySelectorAll(".audio-bar").forEach(bar => {
      bar.querySelector(".ab-knob").style.left = "0%";
      bar.querySelector(".ab-play").innerHTML = ICON_PLAY;
    });
  }

  function play(key) {
    if (!synth) return;
    if (playingKey === key) { stopSpeech(); return; }   // tapping the live bar stops it
    speakFrom(key, 0);
  }

  // Each reading gets a number. Cutting one off to start another fires the old
  // one's end event late — without this check it would stop the new reading.
  let speechId = 0;

  // Read from a point along the bar (0 = start, 1 = end), starting at the
  // beginning of the word under that point.
  function speakFrom(key, frac) {
    stopSpeech();
    const text = textFor(questions[index], key);
    let start = Math.min(text.length - 1, Math.max(0, Math.floor(frac * text.length)));
    while (start > 0 && !/\s/.test(text[start - 1])) start--;
    const bar = document.querySelector(`.audio-bar[data-key="${key}"]`);
    const knob = bar && bar.querySelector(".ab-knob");
    const at = i => { if (knob) knob.style.left = Math.min(100, i / Math.max(1, text.length) * 100) + "%"; };

    const id = ++speechId;
    const u = new SpeechSynthesisUtterance(text.slice(start));
    u.rate = 0.88;                          // a little slow — it's math, and he's nine
    u.lang = "en-US";
    u.onboundary = e => { if (id === speechId && playingKey === key) at(start + e.charIndex); };
    u.onend = u.onerror = () => { if (id === speechId) stopSpeech(); };
    playingKey = key;
    if (bar) bar.querySelector(".ab-play").innerHTML = ICON_STOP;
    at(start);
    // Safari can drop a reading started in the same instant another was cut off.
    setTimeout(() => { if (id === speechId) synth.speak(u); }, 60);
  }

  /* Drag the dot (or tap the line) to hear a part again. Pressing pauses the
     voice; letting go reads on from there. */
  let seeking = null, ignorePlayClickUntil = 0;
  const seekFrac = (track, x) => {
    const r = track.getBoundingClientRect();
    return Math.min(1, Math.max(0, (x - r.left) / Math.max(1, r.width)));
  };
  document.addEventListener("pointerdown", e => {
    const seek = e.target.closest(".ab-seek");
    if (!seek || !synth) return;
    e.preventDefault(); e.stopPropagation();
    seek.setPointerCapture(e.pointerId);
    speechId++; synth.cancel();             // silence while choosing the spot
    const track = seek.querySelector(".ab-track");
    seeking = { key: seek.dataset.seek, seek, track, frac: seekFrac(track, e.clientX) };
    seek.classList.add("dragging");
    seek.querySelector(".ab-knob").style.left = seeking.frac * 100 + "%";
  }, true);
  document.addEventListener("pointermove", e => {
    if (!seeking) return;
    e.preventDefault();
    seeking.frac = seekFrac(seeking.track, e.clientX);
    seeking.seek.querySelector(".ab-knob").style.left = seeking.frac * 100 + "%";
  }, true);
  const endSeek = cancelled => () => {
    if (!seeking) return;
    const { key, seek, frac } = seeking;
    seeking = null;
    seek.classList.remove("dragging");
    ignorePlayClickUntil = Date.now() + 500;   // the bar's own tap-to-stop mustn't fire too
    cancelled ? stopSpeech() : speakFrom(key, frac);
  };
  document.addEventListener("pointerup", endSeek(false), true);
  document.addEventListener("pointercancel", endSeek(true), true);

  /* ---------- Icons (inline so they match the test's look offline) -------- */

  const ICON_PLAY = '<circle cx="12" cy="12" r="10.2" fill="none" stroke="#fff" stroke-width="1.7"/><path d="M9.8 7.9l6.3 4.1-6.3 4.1z" fill="#fff"/>';
  const ICON_STOP = '<circle cx="12" cy="12" r="10.2" fill="none" stroke="#fff" stroke-width="1.7"/><rect x="8.9" y="8.9" width="6.2" height="6.2" rx="1" fill="#fff"/>';
  const ICON_SPK  = '<path d="M3.5 9.2v5.6h3.7l4.8 3.8V5.4L7.2 9.2H3.5z" fill="#fff"/>' +
                    '<path d="M15 8.8a4.6 4.6 0 010 6.4" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/>' +
                    '<path d="M17.8 6.2a8.4 8.4 0 010 11.6" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/>';

  function audioBar(key, small) {
    if (!synth) return "";
    return `<button class="audio-bar ${small ? "sm" : ""}" data-act="play" data-key="${key}" aria-label="Listen">
      <svg class="ab-icon ab-play" viewBox="0 0 24 24">${ICON_PLAY}</svg>
      <span class="ab-seek" data-seek="${key}" aria-label="Drag to choose where to listen from"><span class="ab-track"><span class="ab-knob"></span></span></span>
      <svg class="ab-icon" viewBox="0 0 24 24">${ICON_SPK}</svg>
    </button>`;
  }

  const TICK = '<svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="9" fill="#157f3d"/><path d="M5.6 10.3l2.9 2.9 5.9-6.1" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const CROSS = '<svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="9" fill="#c0271c"/><path d="M6.8 6.8l6.4 6.4M13.2 6.8l-6.4 6.4" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>';

  function radio(on) { return `<svg class="mark" viewBox="0 0 22 22"><circle cx="11" cy="11" r="9" fill="#fff" stroke="${on ? "#3b82f6" : "#b9b9b9"}" stroke-width="1.5"/>${on ? '<circle cx="11" cy="11" r="4.6" fill="#3b82f6"/>' : ""}</svg>`; }
  function check(on) { return `<svg class="mark" viewBox="0 0 22 22"><rect x="2.2" y="2.2" width="17.6" height="17.6" rx="3.4" fill="${on ? "#7ba7f0" : "#fff"}" stroke="${on ? "#7ba7f0" : "#b9b9b9"}" stroke-width="1.5"/>${on ? '<path d="M6.4 11.2l3.1 3.1 6.1-6.3" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>' : ""}</svg>`; }

  /* ---------- Answer bookkeeping ------------------------------------------ */

  function blankAnswer(q) {
    if (q.type === "multi") return [];
    if (q.type === "drag")  return q.answers.map(() => null);
    if (q.type === "work")  return q.entries.map(() => "");
    return null;
  }
  function isAnswered(q, a) {
    if (q.type === "multi") return a && a.length > 0;
    if (q.type === "drag")  return a && a.every(v => v !== null);
    if (q.type === "work")  return a && a.every(v => v !== "");
    return a !== null;
  }
  // How an answer is written: 1352 → "1,352", 3.5 → "3.5".
  function fmtNum(n) {
    const [whole, dec] = String(n).split(".");
    return whole.replace(/\B(?=(\d{3})+(?!\d))/g, ",") + (dec ? "." + dec : "");
  }
  // He types the commas himself, and they count: right means written exactly
  // like the answer (or like another answer the question accepts — an
  // estimate can fairly go more than one way). 1352 or 13,52 is wrong.
  const entryRight = (e, typed) =>
    typed !== "" && [e.answer, ...(e.accept || [])].some(a => fmtNum(a) === typed);
  // Right digits, wrong commas — worth saying, so he sees what to fix.
  function commaSlip(e, typed) {
    if (!typed || entryRight(e, typed)) return "";
    const bare = t => t.replace(/,/g, "");
    const hit = [e.answer, ...(e.accept || [])].find(a => bare(fmtNum(a)) === bare(typed));
    return hit === undefined ? "" : `The number is right — check the commas: write it as ${fmtNum(hit)}.`;
  }
  function isRight(q, a) {
    if (!isAnswered(q, a)) return false;
    if (q.type === "multi") return sameSet(a, q.answers);
    if (q.type === "drag")  return a.every((v, i) => v === q.answers[i]);
    if (q.type === "work")  return q.entries.every((e, i) => entryRight(e, a[i]));
    return a === q.answer;
  }

  /* ---------- Test flow ---------------------------------------------------- */

  function validQuestion(q) {
    if (!q || !q.prompt) return false;
    if (q.type === "work") {
      if (!q.entries && Number.isFinite(q.answer)) q.entries = [{ answer: q.answer, accept: q.accept }];
      return Array.isArray(q.entries) && q.entries.length > 0 &&
             q.entries.every(e => e && Number.isFinite(e.answer));
    }
    if (q.type === "drag")
      return Array.isArray(q.bank) && Array.isArray(q.answers) &&
             (Array.isArray(q.template) || (q.table && Array.isArray(q.table.rows)));
    if (!Array.isArray(q.choices) || q.choices.length < 2) return false;
    return q.type === "multi"
      ? Array.isArray(q.answers) && q.answers.length > 0
      : Number.isInteger(q.answer) && q.answer >= 0 && q.answer < q.choices.length;
  }

  /* A content file either lists its questions, or has a generate() that
     writes a fresh set of numbers each time it's called. shuffle: true
     deals the questions in a new order on every attempt. */
  function buildQuestions() {
    const raw = typeof SOURCE.generate === "function" ? SOURCE.generate() : SOURCE.questions;
    let qs = (raw || []).filter(validQuestion);
    quickPlan = null;
    if (MODE === "quick") {
      const kinds = qs.map(kindOf);
      quickPlan = planQuick(kinds);
      qs = qs.filter((q, i) => quickPlan.pick.includes(kinds[i]));
    }
    if (!SOURCE.shuffle) return qs;
    for (let i = qs.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [qs[i], qs[j]] = [qs[j], qs[i]];
    }
    return qs;
  }

  /* ---------- Quick Check ---------------------------------------------------
     Five questions at a time, working through every kind of problem before
     any kind comes back. The kinds still to come are kept on the device; a
     check only crosses its five off when it's handed in, so one he quits
     halfway comes round again. */
  const QUICK_SIZE = 5;
  const DECK_KEY = "practice.quickdeck.v1";
  const kindOf = (q, i) => q.kind || "q" + i;
  const shuffled = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
  const readDecks = () => { try { return JSON.parse(localStorage.getItem(DECK_KEY)) || {}; } catch { return {}; } };

  function saveDeck(left) {
    const d = readDecks();
    d[KID + "|" + SETID] = left;
    try { localStorage.setItem(DECK_KEY, JSON.stringify(d)); } catch {}
  }

  function planQuick(all) {
    const size = Math.min(QUICK_SIZE, all.length);
    let left = (readDecks()[KID + "|" + SETID] || []).filter(k => all.includes(k));
    if (left.length < size) {
      // Start of a round (or the end of one, topped up from the next). The
      // kinds that finish the old round go to the back of the new one, so they
      // don't come straight back. Saved now, so a check he quits deals the
      // same five next time; nothing is crossed off until he hands one in.
      const tail = left.slice();
      const round = shuffled(all.filter(k => !tail.includes(k)));
      const need = size - tail.length;
      left = tail.concat(round.slice(0, need), round.slice(need), shuffled(tail));
      saveDeck(left);
    }
    return { pick: left.slice(0, size), next: left.slice(size) };
  }
  function commitQuick() { if (quickPlan) saveDeck(quickPlan.next); }

  function start() {
    questions = buildQuestions();      // a new test on every attempt
    answers = questions.map(blankAnswer);
    revealed = false;
    pads = questions.map(() => []); erasing = false;
    index = 0; finished = false; reward = null; armed = null; activeEntry = 0;
    stopSpeech(); render();
  }

  function goTo(i) {
    if (i < 0 || i >= questions.length) return;
    stopSpeech(); index = i; armed = null; activeEntry = 0; erasing = false; render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function pick(i) {
    const q = questions[index];
    if (revealed) return;                       // handed in — answers are locked
    if (q.type === "multi") {
      const a = answers[index];
      const at = a.indexOf(i);
      at === -1 ? a.push(i) : a.splice(at, 1);
    } else {
      answers[index] = i;                       // recorded, not marked
    }
    render();
  }

  function finish() {
    stopSpeech();
    const correct = questions.reduce((n, q, i) => n + (isRight(q, answers[i]) ? 1 : 0), 0);
    reward = window.Progress
      ? window.Progress.record(KID, SETID, Math.round(correct / questions.length * 100))
      : { stars: 0, streak: 0, totalStars: 0 };
    revealed = true; finished = true;
    commitQuick();
    saveHistory(correct);
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  // Everything a parent needs later to see what he missed, and how he worked it.
  function saveHistory(correct) {
    if (!window.WorkHistory) return;
    WorkHistory.save({
      kid: KID, set: SETID, title: TITLE, engine: "math",
      right: correct, total: questions.length,
      items: questions.map((q, i) => ({
        prompt: String(q.prompt).split("\n").join(" "),
        figure: q.figure || undefined,
        given: givenLine(q, answers[i]),
        answer: answerLine(q),
        right: isRight(q, answers[i]),
        note: slipsFor(q, answers[i]) || undefined,
        explain: q.explain || undefined,
        pad: WorkHistory.encodePad(pads[i]) || undefined
      }))
    });
  }

  // Back to the results from a question he reopened. Not a second hand-in,
  // so nothing is recorded again.
  const slipsFor = (q, a) => q.type === "work" && a
    ? q.entries.map((e, i) => commaSlip(e, a[i])).filter(Boolean).join(" ") : "";

  // "Question 7 is still blank" / "Questions 3, 7 and 12 are still blank"
  function blankNote(nums, hint) {
    if (!nums.length) return "";
    const who = nums.length === 1 ? `Question ${nums[0]} is`
      : nums.length > 6 ? `${nums.length} questions are`
      : `Questions ${nums.slice(0, -1).join(", ")} and ${nums[nums.length - 1]} are`;
    return `<div class="gap-note">${who} still blank — ${hint}.</div>`;
  }

  function showResults() {
    stopSpeech(); finished = true; render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  /* ---------- Show your work ----------------------------------------------- */

  function keyIn(d) {
    const q = questions[index];
    if (revealed || q.type !== "work") return;
    const a = answers[index], cur = a[activeEntry];
    if (d === "del") a[activeEntry] = cur.slice(0, -1);
    else if (cur.length < 11) a[activeEntry] = cur + d;      // exactly what he types, commas and all
    render();
  }

  const LANDSCAPE = window.matchMedia("(orientation: landscape) and (min-width: 900px)");

  function mountPad() {
    const c = document.querySelector(".pad canvas");
    if (!c) return;
    c.style.height = "";
    if (LANDSCAPE.matches) {
      const top = c.getBoundingClientRect().top + window.scrollY;
      c.style.height = Math.max(240, window.innerHeight - top - 14) + "px";
    }
    if (!c.clientWidth) return;                 // hidden on this question (upright, no work)
    const dpr = window.devicePixelRatio || 1;
    c.width = c.clientWidth * dpr; c.height = c.clientHeight * dpr;
    const ctx = c.getContext("2d");
    ctx.scale(dpr, dpr);
    ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#1f2a44";
    // Each stroke is { erase, pts }. The eraser is a wide stroke that cuts
    // the ink away, so Undo can take back an erase like any other stroke.
    const strokes = pads[index];
    const pen = erase => {
      ctx.globalCompositeOperation = erase ? "destination-out" : "source-over";
      ctx.lineWidth = erase ? 22 : 2.4;
    };
    const seg = (p, q) => { ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke(); };
    const dot = p => seg(p, { x: p.x + 0.1, y: p.y });
    strokes.forEach(s => {
      pen(s.erase);
      s.pts.length === 1 ? dot(s.pts[0]) : s.pts.forEach((p, i) => i && seg(s.pts[i - 1], p));
    });
    if (revealed) return;                       // his work stays visible, but it's done

    let cur = null;
    const at = e => { const r = c.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
    // iPad Safari decides on text selection, the magnifier and double-tap
    // zoom from the touch events, not the pointer events — so the pad has
    // to cancel those too, or a stroke can still start a selection.
    if (!c._touchGuard) {
      const stop = e => e.preventDefault();
      ["touchstart", "touchmove", "touchend"].forEach(t => c.addEventListener(t, stop, { passive: false }));
      c._touchGuard = true;
    }

    c.onpointerdown = e => {
      e.preventDefault(); c.setPointerCapture(e.pointerId);
      const sel = window.getSelection && window.getSelection();
      if (sel && sel.rangeCount) sel.removeAllRanges();   // clear anything already highlighted
      cur = { erase: erasing, pts: [at(e)] };
      strokes.push(cur); pen(cur.erase); dot(cur.pts[0]);
      syncPadButtons();
    };
    c.onpointermove = e => {
      if (!cur) return;
      e.preventDefault();
      // A pencil reports many points between frames; use them all for smooth lines.
      (e.getCoalescedEvents ? e.getCoalescedEvents() : [e]).forEach(ev => {
        const p = at(ev); seg(cur.pts[cur.pts.length - 1], p); cur.pts.push(p);
      });
    };
    c.onpointerup = c.onpointercancel = () => { cur = null; };
  }

  // Undo and Clear switch on with the first stroke, without redrawing the page.
  function syncPadButtons() {
    const any = (pads[index] || []).length > 0;
    document.querySelectorAll('.pad-btn[data-act="undo"], .pad-btn[data-act="clearpad"]')
      .forEach(b => { b.disabled = !any; });
  }

  window.addEventListener("resize", () => { if (!finished) mountPad(); });

  /* ---------- Drag to fill -------------------------------------------------
     One gesture handles both habits: drag a number into a blank (what the
     real test wants), or tap a number then tap a blank (what actually works
     on an iPad). Tapping a filled blank clears it. */

  let armed = null, ghost = null, dragging = false, startPt = null;

  function placeInBlank(slot, value) {
    answers[index][slot] = value;
    armed = null; render();
  }

  document.addEventListener("pointerdown", e => {
    const chip = e.target.closest(".chip");
    if (!chip || revealed) return;
    startPt = { x: e.clientX, y: e.clientY, chip, value: chip.dataset.value };
    dragging = false;
  });

  document.addEventListener("pointermove", e => {
    if (!startPt) return;
    if (!dragging) {
      if (Math.hypot(e.clientX - startPt.x, e.clientY - startPt.y) < 7) return;
      dragging = true;
      ghost = startPt.chip.cloneNode(true);
      ghost.classList.add("ghost");
      ghost.style.width = startPt.chip.offsetWidth + "px";
      document.body.appendChild(ghost);
    }
    ghost.style.left = (e.clientX - ghost.offsetWidth / 2) + "px";
    ghost.style.top  = (e.clientY - ghost.offsetHeight / 2) + "px";
    ghost.style.display = "none";
    const over = document.elementFromPoint(e.clientX, e.clientY);
    ghost.style.display = "";
    document.querySelectorAll(".blank").forEach(b => b.classList.remove("hot"));
    const blank = over && over.closest(".blank");
    if (blank) blank.classList.add("hot");
  });

  document.addEventListener("pointerup", e => {
    if (!startPt) return;
    const { value } = startPt;
    if (dragging) {
      ghost.style.display = "none";
      const over = document.elementFromPoint(e.clientX, e.clientY);
      ghost.remove(); ghost = null;
      const blank = over && over.closest(".blank");
      startPt = null; dragging = false;
      if (blank) placeInBlank(Number(blank.dataset.slot), value);
      else document.querySelectorAll(".blank").forEach(b => b.classList.remove("hot"));
      return;
    }
    startPt = null;
    armed = armed === value ? null : value;   // plain tap = arm this number
    render();
  });

  /* ---------- Screens ------------------------------------------------------ */

  function navBar(right) {
    return `<div class="nav-bar">
      <a class="nav-back" href="../../index.html">‹ Menu</a>
      <div class="nav-title">${esc(TITLE)}</div>
      <div class="nav-right">${right || ""}</div>
    </div>`;
  }

  function dots() {
    return `<div class="qnav">${questions.map((q, i) => {
      const state = revealed ? (isRight(q, answers[i]) ? "right" : "wrong")
                  : isAnswered(q, answers[i]) ? "answered" : "";
      return `<button class="qdot ${state} ${i === index && !finished ? "current" : ""}"
        data-act="goto" data-i="${i}" aria-label="Question ${i + 1}">${i + 1}</button>`;
    }).join("")}</div>`;
  }

  function promptHtml(q) {
    return String(q.prompt).split("\n")
      .map(l => `<span class="ln">${esc(l)}</span>`).join("");
  }

  function choicesHtml(q) {
    const a = answers[index], done = revealed;
    return `<div class="choices">${q.choices.map((c, i) => {
      const on = q.type === "multi" ? a.includes(i) : a === i;
      const mark = q.type === "multi" ? check(on) : radio(on);
      let extra = "";
      if (done) {
        const isKey = q.type === "multi" ? q.answers.includes(i) : q.answer === i;
        if (isKey) extra = "key";
        else if (on) extra = "miss";
      }
      const role = q.type === "multi" ? "checkbox" : "radio";
      const attrs = `role="${role}" aria-checked="${on}" tabindex="0" data-act="pick" data-i="${i}"`;
      return q.audioChoices
        ? `<div class="choice stacked ${on ? "on" : ""} ${extra}" ${attrs}>
             ${audioBar("c" + i, true)}
             <span class="pick-row">${mark}<span class="choice-text">${esc(c)}</span></span>
           </div>`
        : `<div class="choice ${on ? "on" : ""} ${extra}" ${attrs}>
             ${mark}<span class="choice-text">${esc(c)}</span>
           </div>`;
    }).join("")}</div>`;
  }

  function dragHtml(q) {
    const a = answers[index], done = revealed;
    const bank = done ? "" : `<div class="bank">${q.bank.map(v =>
      `<div class="chip ${armed === v ? "armed" : ""}" data-value="${esc(v)}">${esc(v)}</div>`
    ).join("")}</div>`;

    // Text with {0} {1} … where the blanks go.
    const fill = text => String(text).split(/(\{\d+\})/).map(part => {
      const m = part.match(/^\{(\d+)\}$/);
      if (!m) return esc(part);
      const slot = Number(m[1]);
      const val = a[slot];
      const state = done ? (val === q.answers[slot] ? "key" : "miss") : "";
      return `<span class="blank ${state}" data-act="blank" data-slot="${slot}">${val === null ? "" : esc(val)}</span>`;
    }).join("");

    // A table on the paper is a table here too: headings, and blanks in the cells.
    const lines = q.table
      ? `<table class="drag-table">
          <tr>${q.table.head.map(h => `<th>${esc(h)}</th>`).join("")}</tr>
          ${q.table.rows.map(r => `<tr>${r.map(c => `<td>${fill(c)}</td>`).join("")}</tr>`).join("")}
        </table>`
      : q.template.map(line => line.trim() === "---" ? `<div class="drag-rule"></div>`
          : `<div class="drag-line ${q.mono ? "mono" : ""}">${fill(line)}</div>`).join("");

    // No instructions the real test doesn't show. (Tapping a number and then a
    // box still works, quietly, for when a drag is fiddly on the iPad.)
    return bank + lines;
  }

  function answerLine(q) {
    if (q.type === "work")
      return q.entries.length === 1 ? fmtNum(q.entries[0].answer)
        : q.entries.map(e => `${e.label} = ${fmtNum(e.answer)}`).join("\n");
    if (q.type === "drag")
      return q.answers.map((v, i) => `${i === 0 ? "" : ""}${v}`).join(" , ");
    const L = ["A", "B", "C", "D", "E", "F"];
    if (q.type === "multi")
      return q.answers.slice().sort((x, y) => x - y)
        .map(i => `${L[i]}. ${q.choices[i]}`).join("\n");
    return `${L[q.answer]}. ${q.choices[q.answer]}`;
  }

  // What he put, written the same way as answerLine so the two lines compare.
  function givenLine(q, a) {
    const L = ["A", "B", "C", "D", "E", "F"];
    if (q.type === "work") {
      if (!a || a.every(v => v === "")) return "Left blank";
      return q.entries.length === 1 ? a[0]
        : q.entries.map((e, i) => `${e.label} = ${a[i] === "" ? "—" : a[i]}`).join("\n");
    }
    if (q.type === "drag")
      return a && a.some(v => v !== null) ? a.map(v => v === null ? "—" : v).join(" , ") : "Left blank";
    if (q.type === "multi")
      return a && a.length
        ? a.slice().sort((x, y) => x - y).map(i => `${L[i]}. ${q.choices[i]}`).join("\n")
        : "Left blank";
    return a === null || a === undefined ? "Left blank" : `${L[a]}. ${q.choices[a]}`;
  }

  /* Every question, in order: a tick or a cross, the question, and the right
     answer. A miss also shows what he put and how to work it out. */
  function reviewSheet() {
    const rows = questions.map((q, i) => {
      const right = isRight(q, answers[i]);
      const text = String(q.prompt).split("\n").join(" ");
      return `<div class="rev">
        <div class="rev-top">
          <div class="rev-mark">${right ? TICK : CROSS}</div>
          <div class="rev-def"><span class="rev-num">Question ${i + 1}</span>${esc(text)}</div>
        </div>
        ${right
          ? `<div class="rev-line good">Answer: ${esc(answerLine(q))}</div>`
          : `<div class="rev-line bad">You put: ${esc(givenLine(q, answers[i]))}</div>
             <div class="rev-line good">Answer: ${esc(answerLine(q))}</div>
             ${slipsFor(q, answers[i]) ? `<div class="rev-line slip">${esc(slipsFor(q, answers[i]))}</div>` : ""}
             ${q.explain ? `<div class="rev-why">${esc(q.explain)}</div>` : ""}`}
        ${workPicture(WorkHistory.encodePad(pads[i]), "Your scratch paper")}
      </div>`;
    }).join("");
    return `<div class="review-cap">Review — every question</div>${rows}`;
  }

  const ICON_PENCIL = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M13.6 3.4l3 3L7 16H4v-3z"/><path d="M11.6 5.4l3 3"/></svg>';
  const ICON_ERASER = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M11.4 3.6l5 5-7.6 7.6H5.3l-2.5-2.5z"/><path d="M7.2 7.8l5 5"/><path d="M9 16.2h8"/></svg>';
  const ICON_UNDO   = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 5L4 8.5 7.5 12"/><path d="M4.5 8.5h7a4.5 4.5 0 010 9H9"/></svg>';

  // His scratch paper, cropped to where he wrote — on the review sheet.
  function workPicture(enc, caption) {
    const img = window.WorkHistory && WorkHistory.padImage(enc);
    return img ? `<div class="rev-work"><div class="rev-work-cap">${caption}</div>
      <img src="${img.src}" width="${img.w}" height="${img.h}" alt="${caption}"></div>` : "";
  }

  function padHtml() {
    const strokes = pads[index] || [];
    const tools = revealed ? "" : `
      <span class="pad-tools">
        <button class="pad-btn ${erasing ? "" : "on"}" data-act="pen" aria-pressed="${!erasing}">${ICON_PENCIL}Pencil</button>
        <button class="pad-btn ${erasing ? "on" : ""}" data-act="eraser" aria-pressed="${erasing}">${ICON_ERASER}Eraser</button>
      </span>
      <button class="pad-btn" data-act="undo" ${strokes.length ? "" : "disabled"}>${ICON_UNDO}Undo</button>
      <button class="pad-btn" data-act="clearpad" ${strokes.length ? "" : "disabled"}>Clear</button>`;
    return `<div class="pad ${erasing ? "erasing" : ""}">
      <div class="pad-bar"><span class="pad-cap">Scratch Paper</span>${tools}</div>
      <canvas aria-label="Scratch Paper"></canvas>
    </div>`;
  }

  function workHtml(q) {
    const a = answers[index];
    const rows = q.entries.map((e, i) => {
      const typed = a[i];
      const state = revealed ? (entryRight(e, typed) ? "key" : "miss") : (i === activeEntry ? "active" : "");
      // Like the real test: an empty box, no hint. The first box starts
      // selected, with a blinking cursor; tapping another box moves to it.
      const shown = typed ? esc(typed) : "";
      const caret = !revealed && i === activeEntry ? `<span class="entry-caret"></span>` : "";
      return `<div class="entry">
        ${e.label ? `<span class="entry-label">${esc(e.label)}</span>` : ""}
        <div class="entry-box ${state}" data-act="entry" data-e="${i}">${typed ? shown + caret : caret + shown}</div>
      </div>`;
    }).join("");
    const key = (d, cls = "", label = d) => `<button class="num ${cls}" data-act="digit" data-d="${d}" aria-label="${label}">${d}</button>`;
    const keys = revealed ? "" : `<div class="numpad">
      ${["1","2","3","4","5","6","7","8","9"].map(d => key(d)).join("")}
      ${key("0")}${key(",", "sym", "comma")}${key(".", "sym", "point")}
      <button class="num del" data-act="digit" data-d="del" aria-label="Delete">⌫ Delete</button>
    </div>`;
    return `<div class="entry-wrap"><div class="entries">${rows}</div>${keys}</div>`;
  }

  function questionCard(q) {
    const done = revealed;
    const right = done && isRight(q, answers[index]);
    const verdict = done
      ? (right ? `<div class="verdict right">${TICK}Correct</div>`
               : `<div class="verdict wrong">${CROSS}Incorrect</div>`)
      : "";
    const noVoice = synth ? "" : `<div class="no-voice">Read-aloud needs Chrome or Safari.</div>`;


    let why = "";
    if (done && !right) {
      const slip = slipsFor(q, answers[index]);
      why = `<div class="why"><strong>Answer:</strong> ${esc(answerLine(q))}` +
            (slip ? `<br><strong>${esc(slip)}</strong>` : "") +
            (q.explain ? `<br>${esc(q.explain)}` : "") + `</div>`;
    } else if (done && q.explain) {
      why = `<div class="why">${esc(q.explain)}</div>`;
    }

    const head = `${verdict}${audioBar("q", false)}${noVoice}
      <div class="q-text">${promptHtml(q)}</div>
      ${q.figure ? `<pre class="q-figure">${esc(q.figure)}</pre>` : ""}`;

    const body = q.type === "drag" ? dragHtml(q) : q.type === "work" ? workHtml(q) : choicesHtml(q);
    return `<div class="test-surface">${head}${body}${why}</div>`;
  }

  function resultsScreen() {
    const correct = questions.reduce((n, q, i) => n + (isRight(q, answers[i]) ? 1 : 0), 0);
    const pct = Math.round(correct / questions.length * 100);
    const r = reward || { stars: 0, streak: 0, totalStars: 0 };
    const head = r.stars >= 3 ? "Amazing! 🏆" : r.stars === 2 ? "Great job! 🎉"
               : r.stars === 1 ? "Nice work! 👍" : "Keep going! 💪";
    const stars = [1, 2, 3].map(i => `<span class="big-star ${i <= r.stars ? "on" : ""}">★</span>`).join("");
    const chips = [
      r.streakUp ? `<div class="reward-chip fire">🔥 ${r.streak}-day streak</div>` : "",
      r.isNewBest ? `<div class="reward-chip new">⭐ New best!</div>` : "",
      `<div class="reward-chip">⭐ ${r.totalStars} total</div>`
    ].join("");

    const missed = questions.map((q, i) => ({ q, i })).filter(({ q, i }) => !isRight(q, answers[i]));
    const again = missed.length
      ? `<div class="progress-cap" style="margin-top:22px">Worth another look — tap a number</div>${dots()}`
      : `<div class="progress-cap" style="margin-top:22px">Every one correct 🎯</div>`;

    return `${navBar("")}
      <div class="card reward">
        <div class="reward-stars">${stars}</div>
        <div class="headline">${head}</div>
        <div class="pct">${correct} of ${questions.length} correct · ${pct}%</div>
        <div class="reward-chips">${chips}</div>
        <button class="btn-primary" data-act="again">Try Again</button>
        <div style="margin-top:10px"><a class="btn-text" href="../../index.html">Back to Menu</a></div>
      </div>
      ${again}
      ${reviewSheet()}`;
  }

  function render() {
    if (finished) { $("app").innerHTML = resultsScreen(); return; }

    const q = questions[index];
    const last = index === questions.length - 1;
    const answered = questions.filter((qq, i) => isAnswered(qq, answers[i])).length;
    // Next always works, so he can skip a question and come back to it.
    // The last question hands the test in with Submit.
    let mainBtn, note = "";
    if (revealed) {
      mainBtn = `<button class="btn-primary submit" data-act="results">Back to Results</button>`;
    } else if (last) {
      mainBtn = `<button class="btn-primary submit" data-act="finish">Submit</button>`;
      note = blankNote(questions.map((qq, i) => isAnswered(qq, answers[i]) ? 0 : i + 1).filter(Boolean),
                       "tap a number at the top to go back");
    } else {
      mainBtn = `<button class="btn-primary" data-act="next">Next ›</button>`;
    }

    // The card is the test; the scratch paper is beside it, like the sheet
    // he'd have on his desk. Landscape: paper on the left, test on the right.
    const showsWork = q.type === "work" || q.pad;
    $("app").innerHTML = `${navBar(`${index + 1}/${questions.length}`)}
      <div class="progress-track"><div class="progress-fill" style="width:${answered / questions.length * 100}%"></div></div>
      <div class="progress-cap">Question ${index + 1} of ${questions.length}</div>
      ${dots()}
      <div class="stage ${showsWork ? "shows-work" : ""}">
        <div class="stage-card">${questionCard(q)}${note}</div>
        <div class="stage-pad">${padHtml()}</div>
        <div class="stage-foot test-foot action-bar">
          <button class="btn-sec" data-act="prev" ${index === 0 ? "disabled" : ""}>‹ Back</button>
          ${mainBtn}
        </div>
      </div>`;
    mountPad();
  }

  /* Which test? Shown when the tile offers a Quick Check and the full
     Practice Assessment and he hasn't picked yet. Each keeps its own stars. */
  function whichScreen(id, base, modes) {
    const icons = { quick: "⚡", full: "📝" };
    const cards = modes.map(m => {
      const key = m.mode && m.mode !== "full" ? `${id}:${m.mode}` : id;
      const p = window.Progress ? Progress.getActivity(KID, key) : { plays: 0 };
      const stars = [1, 2, 3].map(i => `<span class="${p.plays && i <= p.bestStars ? "on" : ""}">★</span>`).join("");
      return `<a class="which-card" href="?set=${encodeURIComponent(id)}&mode=${encodeURIComponent(m.mode)}">
        <div class="which-icon ${esc(m.mode)}">${icons[m.mode] || "✏️"}</div>
        <div class="which-title">${esc(m.title)}</div>
        <div class="which-foot"><span class="which-stars">${stars}</span>
          ${p.plays ? `<span class="which-best">Best ${p.bestPct}%</span>` : ""}</div>
      </a>`;
    }).join("");
    document.title = base;
    $("app").innerHTML = `${navBar("")}
      <h1 class="which-head">${esc(base)}</h1>
      <p class="which-sub">Which one?</p>
      <div class="which">${cards}</div>`;
  }

  /* Delegated clicks — question text can hold quotes and math symbols,
     so nothing is interpolated into inline handlers. */
  document.addEventListener("click", e => {
    const el = e.target.closest("[data-act]");
    if (!el || el.disabled || el.hasAttribute("disabled")) return;
    switch (el.dataset.act) {
      case "play":   e.stopPropagation(); if (Date.now() > ignorePlayClickUntil) play(el.dataset.key); break;
      case "pick":   pick(Number(el.dataset.i)); break;
      case "goto":   if (finished) finished = false; goTo(Number(el.dataset.i)); break;
      case "prev":   goTo(index - 1); break;
      case "next":   goTo(index + 1); break;
      case "finish":  finish(); break;
      case "results": showResults(); break;
      case "digit":   keyIn(el.dataset.d); break;
      case "entry":   if (!revealed) { activeEntry = Number(el.dataset.e); render(); } break;
      case "clearpad": pads[index] = []; render(); break;
      case "undo":     pads[index].pop(); render(); break;
      case "pen":      erasing = false; render(); break;
      case "eraser":   erasing = true; render(); break;
      case "again":  start(); break;
      case "blank": {
        if (revealed) break;
        const slot = Number(el.dataset.slot);
        if (armed !== null) placeInBlank(slot, armed);
        else { answers[index][slot] = null; render(); }
        break;
      }
    }
  });

  document.addEventListener("keydown", e => {
    if (e.key !== " " && e.key !== "Enter") return;
    const el = document.activeElement;
    if (el && el.classList && el.classList.contains("choice")) { e.preventDefault(); el.click(); }
  });

  window.addEventListener("pagehide", stopSpeech);

  GameLoader.loadSet("../../").then(({ data, title, kidId, id, mode, key, base, modes }) => {
    TITLE = title; document.title = title; KID = kidId; SETID = key || id; MODE = mode || "";
    SOURCE = data;
    if (modes && !modes.some(m => m.mode === MODE)) return whichScreen(id, base, modes);
    if (!buildQuestions().length) throw new Error("This practice test has no questions yet.");
    start();
  }).catch(err => {
    $("app").innerHTML = `<div class="card err"><div class="emoji">😕</div>
      <div class="msg">${esc(err.message)}</div>
      <a class="btn-text" href="../../index.html">Back to Menu</a></div>`;
  });
</script>
</body>
</html>
